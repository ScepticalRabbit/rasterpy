[build-system]
requires = [
  "setuptools>=61.0",
  "wheel",
  "Cython>=3.0.0",
  "numpy>=2.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "rasterpy"
version = "2026.8.0"
description = "Legacy Python and Cython scalar-field rasterisers for DIC."
authors = [
  { name = "Sceptical Rabbit (Lloyd Fletcher)" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
examples = [
  "pyvale>=2026.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "Cython>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rasterpy = ["data/*.e"]
